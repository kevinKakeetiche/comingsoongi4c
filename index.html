<meta name="description" content="Global Impact for Communities (GI4C) — Healthy People, Resilient and Sustainable Communities. Site bientôt disponible.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --blue: #2b5faa;
    --blue-deep: #1d3f73;
    --green: #7cb342;
    --green-deep: #4a7c2a;
    --ink: #1c2530;
    --paper: #fbfbf9;
    --muted: #64748b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background:
      radial-gradient(ellipse 900px 700px at 18% 8%, rgba(43, 95, 170, 0.09), transparent 60%),
      radial-gradient(ellipse 900px 700px at 85% 95%, rgba(124, 179, 66, 0.10), transparent 60%),
      var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
    padding: 32px 0 76px;
  }

  /* Graticule: faint globe meridian/parallel lines, echoing the logo's globe */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg, rgba(29, 63, 115, 0.05) 0px, rgba(29, 63, 115, 0.05) 1px, transparent 1px, transparent 84px),
      repeating-linear-gradient(90deg, rgba(29, 63, 115, 0.05) 0px, rgba(29, 63, 115, 0.05) 1px, transparent 1px, transparent 84px);
    mask-image: radial-gradient(ellipse 70% 65% at 50% 42%, #000 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse 70% 65% at 50% 42%, #000 0%, transparent 72%);
  }

  /* Soft glow anchoring the logo */
  .glow {
    position: absolute;
    top: 42%;
    left: 50%;
    width: 620px;
    height: 620px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(224, 236, 250, 0.55) 38%, rgba(224, 236, 250, 0) 70%);
    z-index: 0;
    pointer-events: none;
  }

  /* Ambient rings echoing the logo's circular globe motif */
  .rings {
    position: absolute;
    top: 42%;
    left: 50%;
    width: 620px;
    height: 620px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }

  .rings::before,
  .rings::after {
    content: '';
    position: absolute;
    border-radius: 50%;
  }

  .rings::before {
    inset: 0;
    background: conic-gradient(from 0deg, rgba(43, 95, 170, 0.32), transparent 24%, transparent 76%, rgba(43, 95, 170, 0.32));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    animation: spin 50s linear infinite;
  }

  .rings::after {
    inset: 74px;
    background: conic-gradient(from 180deg, rgba(124, 179, 66, 0.34), transparent 24%, transparent 76%, rgba(124, 179, 66, 0.34));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    animation: spin 38s linear infinite reverse;
  }

  .ring-outer {
    position: absolute;
    top: 42%;
    left: 50%;
    width: 820px;
    height: 820px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(29, 63, 115, 0.10);
    z-index: 0;
    pointer-events: none;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 640px) {
    .glow, .rings { width: 440px; height: 440px; }
    .rings::after { inset: 50px; }
    .ring-outer { width: 560px; height: 560px; }
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px 24px;
    max-width: 640px;
  }

  .logo-wrap {
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
  }

  .logo-wrap img {
    width: min(58vw, 300px);
    height: auto;
    display: block;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .divider {
    width: 56px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--blue), var(--green));
    margin: 34px 0 26px;
    opacity: 0;
    animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
  }

  .status {
    opacity: 0;
    animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
  }

  .status .en {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    color: var(--blue-deep);
    letter-spacing: -0.01em;
    line-height: 1.15;
  }

  .status .fr {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: clamp(0.95rem, 2.6vw, 1.1rem);
    color: var(--green-deep);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 10px;
  }

  .tagline {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.6;
    opacity: 0;
    animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.8s forwards;
  }

  .tagline strong {
    color: var(--ink);
    font-weight: 600;
  }

  footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.02em;
    opacity: 0;
    animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
    z-index: 1;
    padding: 0 16px;
  }

  footer a {
    color: var(--blue);
    text-decoration: none;
    border-bottom: 1px solid rgba(43, 95, 170, 0.3);
  }

  @media (prefers-reduced-motion: reduce) {
    .rings::before, .rings::after { animation: none; }
    .logo-wrap, .divider, .status, .tagline, footer { animation: none; opacity: 1; }
  }
</style>
</head>
